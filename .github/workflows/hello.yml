name: Ola mundo cruel  # nome da action

# Gatilho, quando a action vai rodar
on:
  push:
    branches: ['main']

# Cria as tarefas que devem ser executadas
jobs:
  saudacao: # nome da tarefa
    runs-on: ubuntu-latest # onde deve se executado
    steps: # etapas
      - name: Primeiro contato
        run: echo "Ola mundo cruel"
      - name: Resposta
        run: echo "A extinção esta chegando"
      - name: verificar se e humano
        run: echo "qual a resposta de 2 + 2?"
      - name: resposta do captcha
        run: echo "$((2 + 2))"
  adeus:
    runs-on: ubuntu-latest
    steps:
      - name: "O fim"
        run: echo "Apos um a tempestade solar, a humanidade virou churrasquinho"
      - name: "Nova era"
        run: echo "Uma nova raça animal começa a dominar o planeta."
